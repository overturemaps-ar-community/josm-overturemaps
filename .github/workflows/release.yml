name: Release plugin JAR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish tagged release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use semantic version format, for example v0.1.0" >&2
            exit 1
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap pinned dependencies
        run: make bootstrap

      - name: Test and build release JAR
        run: mvn --batch-mode -Dplugin.version="${{ steps.version.outputs.value }}" clean test package

      - name: Verify and stage release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          actual="$(unzip -p target/overturemaps.jar META-INF/MANIFEST.MF | sed -n 's/^Plugin-Version: //p' | tr -d '\r')"
          [[ "$actual" == "$version" ]] || { echo "Manifest version $actual does not match tag $version" >&2; exit 1; }
          mkdir -p release
          cp target/overturemaps.jar "release/overturemaps-${version}.jar"
          sha256sum "release/overturemaps-${version}.jar" > "release/overturemaps-${version}.jar.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/overturemaps-${{ steps.version.outputs.value }}.jar" \
            "release/overturemaps-${{ steps.version.outputs.value }}.jar.sha256" \
            --verify-tag --generate-notes --title "Overture Maps ${{ steps.version.outputs.value }}"
